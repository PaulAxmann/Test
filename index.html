<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firmennews</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f0e8; --ink: #1a1208; --mid: #7a6f5e;
  --border: #cec6b8; --accent: #c8360a; --green: #2a6b3c;
  --card: #faf8f4;
}
body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding: 0 20px 80px; }
.wrap { max-width: 700px; margin: 0 auto; }
header { padding: 64px 0 48px; border-bottom: 1px solid var(--border); margin-bottom: 48px; }
.kicker { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
h1 { font-family: 'DM Serif Display', serif; font-size: clamp(2.8rem, 7vw, 4.5rem); line-height: 1.0; letter-spacing: -0.02em; margin-bottom: 12px; }
h1 em { font-style: italic; color: var(--accent); }
.tagline { font-size: 0.9rem; color: var(--mid); font-weight: 300; line-height: 1.5; }
.search-area { margin-bottom: 48px; }
.field-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mid); display: block; margin-bottom: 8px; }
.input-row { display: flex; gap: 8px; }
input[type="text"] {
  flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--ink);
  font-family: 'DM Sans', sans-serif; font-size: 1.05rem; font-weight: 500;
  padding: 13px 16px; border-radius: 4px; outline: none;
  transition: border-color 0.15s;
}
input:focus { border-color: var(--ink); }
input::placeholder { color: var(--border); font-weight: 300; }
button#btn {
  background: var(--ink); color: var(--bg); border: none;
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; padding: 13px 20px; border-radius: 4px;
  cursor: pointer; transition: background 0.15s; white-space: nowrap;
}
button#btn:hover { background: #333; }
button#btn:disabled { background: var(--border); color: var(--mid); cursor: not-allowed; }
.loading { display: flex; align-items: center; gap: 12px; padding: 32px 0; color: var(--mid); font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.1em; }
.dot-pulse { display: flex; gap: 4px; }
.dot-pulse span { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; animation: pulse 1.2s ease-in-out infinite; }
.dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
.dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }
.co-name { font-family: 'DM Serif Display', serif; font-size: 2rem; margin-bottom: 4px; }
.co-count { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--mid); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 24px; }
.cards { display: flex; flex-direction: column; }
.card { padding: 20px 0; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 90px 1fr; gap: 0 20px; animation: fadeIn 0.3s ease both; }
.card:first-child { border-top: 1px solid var(--border); }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.tag { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; display: block; margin-bottom: 6px; padding-top: 3px; }
.card-date { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--mid); }
.card-title { font-family: 'DM Serif Display', serif; font-size: 1.05rem; line-height: 1.3; margin-bottom: 6px; }
.card-body { font-size: 0.85rem; color: var(--mid); line-height: 1.65; font-weight: 300; }
.state-box { padding: 40px 0; }
.state-title { font-family: 'DM Serif Display', serif; font-size: 1.4rem; margin-bottom: 6px; }
.state-sub { font-size: 0.85rem; color: var(--mid); font-weight: 300; }
.err { color: var(--accent); font-size: 0.8rem; padding: 24px 0; font-family: 'DM Mono', monospace; line-height: 1.7; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Nachrichten-Briefing</div>
    <h1>Firmen<em>news</em></h1>
    <p class="tagline">M&A · Führungswechsel · Stellenabbau · Gewinnwarnungen<br>Nur was wirklich zählt — kein Rauschen.</p>
  </header>
  <div class="search-area">
    <label class="field-label" for="q">Firmenname eingeben</label>
    <div class="input-row">
      <input type="text" id="q" placeholder="z.B. Volkswagen, Siemens, BASF …" autocomplete="off" />
      <button id="btn" onclick="go()">Suchen</button>
    </div>
  </div>
  <div id="output"></div>
</div>
<script>
const q = document.getElementById('q');
const out = document.getElementById('output');
const btn = document.getElementById('btn');
q.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

const TYPES = {
  ma:       { label: 'M&A',         color: '#7c3aed' },
  ceo:      { label: 'Führung',      color: '#2a6b3c' },
  layoff:   { label: 'Stellenabbau', color: '#c8360a' },
  financial:{ label: 'Finanzen',     color: '#0369a1' },
  legal:    { label: 'Recht',        color: '#be123c' },
  product:  { label: 'Produkt',      color: '#b45309' },
  other:    { label: 'Sonstiges',    color: '#7a6f5e' },
};

async function go() {
  const query = q.value.trim();
  if (!query) return;
  btn.disabled = true;
  out.innerHTML = `<div class="loading"><div class="dot-pulse"><span></span><span></span><span></span></div>Recherchiere …</div>`;
  try {
    const resp = await fetch('/api/news', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });
    const raw = await resp.text();
    if (!resp.ok || raw[0] !== '{') throw new Error('HTTP ' + resp.status + ': ' + raw.slice(0,300));
    const d = JSON.parse(raw);
    if (d.error) throw new Error(d.error);
    render(d);
  } catch(e) {
    out.innerHTML = `<div class="err">Fehler: ${e.message}</div>`;
  }
  btn.disabled = false;
}

function render(d) {
  if (d.status === 'not_found') {
    out.innerHTML = `<div class="state-box"><div class="state-title">Nicht gefunden</div><div class="state-sub">Diese Firma konnte nicht identifiziert werden.</div></div>`;
    return;
  }
  if (d.nothing_new || !d.items?.length) {
    out.innerHTML = `<div class="co-name">${d.company}</div><div class="state-box"><div class="state-title">Nichts Neues</div><div class="state-sub">Keine wichtigen Entwicklungen in letzter Zeit.</div></div>`;
    return;
  }
  const cards = d.items.map((item, i) => {
    const t = TYPES[item.type] || TYPES.other;
    return `<div class="card" style="animation-delay:${i*0.06}s">
      <div><span class="tag" style="color:${t.color}">${t.label}</span><div class="card-date">${item.date||''}</div></div>
      <div><div class="card-title">${item.title}</div><div class="card-body">${item.summary}</div></div>
    </div>`;
  }).join('');
  out.innerHTML = `<div class="co-name">${d.company}</div><div class="co-count">${d.items.length} Meldung${d.items.length!==1?'en':''}</div><div class="cards">${cards}</div>`;
}
</script>
</body>
</html>
